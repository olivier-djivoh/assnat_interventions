{% extends 'base.html' %}
{% load static %}

{% block content %}
<style>
    /* --- VARIABLES --- */
    :root {
        --primary: #0d6efd;
        --primary-dark: #0a58ca;
        --success: #10b981;
        --warning: #f59e0b;
        --danger: #ef4444;
        --gray-light: #f8fafc;
        --gray-border: #e2e8f0;
        --text-dark: #0f172a;
        --text-muted: #475569;
        --radius-card: 20px;
        --radius-input: 12px;
        --shadow-sm: 0 4px 10px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
        --transition: all 0.2s ease;
    }

    /* Animation d'entrée */
    @keyframes fadeSlideUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* En-tête */
    .page-header {
        margin-bottom: 1.5rem;
        animation: fadeSlideUp 0.4s ease-out;
    }
    .page-header h2 {
        font-weight: 700;
        color: var(--text-dark);
        margin: 0;
    }
    .page-header h2 i {
        color: var(--primary);
    }

    /* Carte des filtres */
    .filters-card {
        border: none;
        border-radius: var(--radius-card);
        background: white;
        box-shadow: var(--shadow-sm);
        transition: var(--transition);
        animation: fadeSlideUp 0.45s ease-out;
        margin-bottom: 1.5rem;
    }
    .filters-card .card-body {
        padding: 1.2rem 1.5rem;
    }
    .filters-card .form-label {
        font-weight: 600;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-muted);
        margin-bottom: 0.4rem;
    }
    .filters-card .form-select,
    .filters-card .form-control {
        border: 1px solid var(--gray-border);
        border-radius: var(--radius-input);
        padding: 0.5rem 0.8rem;
        font-size: 0.9rem;
        transition: var(--transition);
    }
    .filters-card .form-select:focus,
    .filters-card .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(13,110,253,0.1);
        outline: none;
    }
    .btn-primary {
        background: linear-gradient(115deg, var(--primary) 0%, var(--primary-dark) 100%);
        border: none;
        border-radius: 40px;
        padding: 0.45rem 1.2rem;
        font-weight: 500;
        transition: var(--transition);
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 12px rgba(13,110,253,0.2);
    }
    .btn-secondary {
        background-color: #f1f5f9;
        border: 1px solid var(--gray-border);
        color: var(--text-dark);
        border-radius: 40px;
        padding: 0.45rem 1.2rem;
        transition: var(--transition);
    }
    .btn-secondary:hover {
        background-color: #e6edf5;
        transform: translateY(-2px);
    }

    /* Carte du tableau */
    .table-card {
        border: none;
        border-radius: var(--radius-card);
        background: white;
        box-shadow: var(--shadow-md);
        overflow: hidden;
        animation: fadeSlideUp 0.5s ease-out;
    }
    .table-card .card-header {
        background: linear-gradient(115deg, #1e293b 0%, #0f172a 100%);
        color: white;
        padding: 1rem 1.5rem;
        border-bottom: none;
        font-weight: 600;
        font-size: 1rem;
    }
    .table-card .card-header i {
        margin-right: 0.5rem;
    }
    .table-card .card-body {
        padding: 0;
    }

    /* Tableau stylisé */
    .table-attribuees {
        margin-bottom: 0;
        width: 100%;
    }
    .table-attribuees thead th {
        background-color: var(--gray-light);
        color: var(--text-dark);
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        border-bottom: 1px solid var(--gray-border);
        padding: 1rem 0.75rem;
    }
    .table-attribuees tbody tr {
        transition: var(--transition);
    }
    .table-attribuees tbody tr:hover {
        background-color: #fefce8;
        transform: scale(1.01);
        box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .table-attribuees td {
        padding: 0.9rem 0.75rem;
        vertical-align: middle;
        border-bottom: 1px solid #f0f2f5;
    }

    /* Badges */
    .badge {
        padding: 0.35rem 0.8rem;
        font-weight: 500;
        border-radius: 40px;
        font-size: 0.75rem;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }
    .badge.bg-warning {
        background-color: #fff3e6 !important;
        color: #d97706 !important;
    }
    .badge.bg-success {
        background-color: #e6f7ef !important;
        color: #059669 !important;
    }

    /* Bouton Voir */
    .btn-sm {
        padding: 0.3rem 0.8rem;
        border-radius: 30px;
        font-size: 0.75rem;
        transition: var(--transition);
    }
    .btn-info {
        background-color: #e6f0ff;
        border: none;
        color: var(--primary);
    }
    .btn-info:hover {
        background-color: var(--primary);
        color: white;
        transform: translateY(-2px);
    }

    /* Pagination */
    .pagination-nav {
        padding: 1rem 0;
        background-color: white;
        border-top: 1px solid var(--gray-border);
    }
    .pagination {
        margin-bottom: 0;
        gap: 4px;
    }
    .pagination .page-link {
        color: var(--primary);
        border: none;
        border-radius: 30px;
        padding: 0.4rem 0.8rem;
        font-weight: 500;
        transition: var(--transition);
    }
    .pagination .page-link:hover {
        background-color: #e6f0ff;
        transform: translateY(-2px);
    }
    .pagination .page-item.active .page-link {
        background: linear-gradient(115deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        box-shadow: 0 2px 6px rgba(13,110,253,0.2);
    }

    /* Responsive */
    @media (max-width: 768px) {
        .table-attribuees thead th, .table-attribuees td {
            white-space: nowrap;
        }
        .btn-sm {
            padding: 0.2rem 0.5rem;
            font-size: 0.7rem;
        }
    }
</style>

<div class="page-header d-flex justify-content-between align-items-center flex-wrap gap-3">
    <h2><i class="fas fa-check-double me-2"></i> Requêtes attribuées</h2>
    <a href="{% url 'creer_requete' %}" class="btn btn-primary">
        <i class="fas fa-plus-circle me-1"></i> Nouvelle requête
    </a>
</div>

<!-- Filtres -->
<div class="card filters-card">
    <div class="card-body">
        <div class="row g-3 align-items-end">
            <div class="col-md-3">
                <label class="form-label">Statut</label>
                <select id="statutFilter" class="form-select">
                    <option value="tous">Tous les statuts</option>
                    <option value="EN_ATTENTE">En attente</option>
                    <option value="RESOLU">Résolu</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Division</label>
                <select id="divisionFilter" class="form-select">
                    <option value="tous">Toutes les divisions</option>
                    {% for division in divisions %}
                        <option value="{{ division.id }}">{{ division.nom }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <label class="form-label">Recherche</label>
                <input type="text" id="searchInput" class="form-control" placeholder="Demandeur, type, description...">
            </div>
            <div class="col-md-2">
                <div class="d-flex gap-2">
                    <button id="filterBtn" class="btn btn-primary w-100">Filtrer</button>
                    <button id="resetBtn" class="btn btn-secondary w-100">Réinitialiser</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Liste des requêtes attribuées -->
<div class="card table-card">
    <div class="card-header">
        <i class="fas fa-tasks"></i> Requêtes attribuées <span id="totalCount" class="badge bg-light text-dark ms-2">0</span>
    </div>
    <div class="card-body p-0">
        <div id="requetesList">
            <div class="text-center py-5">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Chargement...</span>
                </div>
                <p class="mt-2 text-muted">Chargement des requêtes...</p>
            </div>
        </div>
    </div>
    <div id="paginationNav" style="display: none;" class="pagination-nav">
        <ul class="pagination justify-content-center" id="paginationList"></ul>
    </div>
</div>

<script>
let currentPage = 1;
let currentStatut = 'tous';
let currentDivision = 'tous';
let currentSearch = '';
let totalPages = 1;

function loadRequetes() {
    document.getElementById('requetesList').innerHTML = '<div class="text-center py-5"><div class="spinner-border text-primary" role="status"><span class="visually-hidden">Chargement...</span></div><p class="mt-2 text-muted">Chargement des requêtes...</p></div>';
    
    let url = `/requetes/api/requetes-attribuees/?page=${currentPage}&per_page=10&statut=${currentStatut}`;
    if (currentDivision !== 'tous') {
        url += `&division=${currentDivision}`;
    }
    if (currentSearch) {
        url += `&search=${encodeURIComponent(currentSearch)}`;
    }
    
    fetch(url)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                document.getElementById('requetesList').innerHTML = `<div class="alert alert-danger m-3">${data.error}</div>`;
                document.getElementById('paginationNav').style.display = 'none';
                return;
            }
            
            if (!data.requetes || data.requetes.length === 0) {
                document.getElementById('requetesList').innerHTML = '<div class="alert alert-info text-center m-3"><i class="fas fa-info-circle me-2"></i>Aucune requête attribuée trouvée.</div>';
                document.getElementById('paginationNav').style.display = 'none';
                return;
            }
            
            totalPages = data.total_pages;
            document.getElementById('totalCount').innerHTML = '(' + data.total + ')';
            
            // Construction du tableau
            let html = '<div class="table-responsive"><table class="table table-attribuees">';
            html += '<thead><th>N°</th><th>Date</th><th>Heure</th><th>Statut</th><th>Demandeur</th><th>Type</th><th>Division</th><th>Chef de division</th><th>Actions</th></thead><tbody>';
            
            for (let i = 0; i < data.requetes.length; i++) {
                const req = data.requetes[i];
                const statutClass = req.statut_code === 'EN_ATTENTE' ? 'bg-warning' : 'bg-success';
                const statutIcon = req.statut_code === 'EN_ATTENTE' ? '<i class="fas fa-clock"></i>' : '<i class="fas fa-check-circle"></i>';
                
                html += '<tr>';
                html += '<td><strong>#' + req.id + '</strong></td>';
                html += '<td>' + req.date + '</td>';
                html += '<td>' + req.heure + '</td>';
                html += '<td><span class="badge ' + statutClass + '">' + statutIcon + ' ' + req.statut + '</span></td>';
                html += '<td>' + req.demandeur + '</td>';
                html += '<td>' + req.type_demande + '</td>';
                html += '<td>' + req.division + '</td>';
                html += '<td>' + req.chef_division + '</td>';
                html += '<td><a href="' + req.url + '" class="btn btn-sm btn-info"><i class="fas fa-eye"></i> Voir</a></td>';
                html += '</tr>';
            }
            html += '</tbody></table></div>';
            document.getElementById('requetesList').innerHTML = html;
            
            // Pagination
            if (data.total_pages > 1) {
                let pagHtml = '';
                if (data.current_page > 1) {
                    pagHtml += '<li class="page-item"><a class="page-link" href="#" data-page="' + (data.current_page - 1) + '">«</a></li>';
                } else {
                    pagHtml += '<li class="page-item disabled"><span class="page-link">«</span></li>';
                }
                for (let i = 1; i <= data.total_pages; i++) {
                    if (i === data.current_page) {
                        pagHtml += '<li class="page-item active"><span class="page-link">' + i + '</span></li>';
                    } else {
                        pagHtml += '<li class="page-item"><a class="page-link" href="#" data-page="' + i + '">' + i + '</a></li>';
                    }
                }
                if (data.current_page < data.total_pages) {
                    pagHtml += '<li class="page-item"><a class="page-link" href="#" data-page="' + (data.current_page + 1) + '">»</a></li>';
                } else {
                    pagHtml += '<li class="page-item disabled"><span class="page-link">»</span></li>';
                }
                document.getElementById('paginationList').innerHTML = pagHtml;
                document.getElementById('paginationNav').style.display = 'block';
                
                document.querySelectorAll('#paginationList .page-link').forEach(link => {
                    const page = link.getAttribute('data-page');
                    if (page) {
                        link.onclick = function(e) {
                            e.preventDefault();
                            const newPage = parseInt(page);
                            if (newPage && newPage !== currentPage) {
                                currentPage = newPage;
                                loadRequetes();
                            }
                        };
                    }
                });
            } else {
                document.getElementById('paginationNav').style.display = 'none';
            }
        })
        .catch(error => {
            console.error('Erreur:', error);
            document.getElementById('requetesList').innerHTML = '<div class="alert alert-danger m-3">Erreur de chargement des données.</div>';
            document.getElementById('paginationNav').style.display = 'none';
        });
}

function resetFilters() {
    document.getElementById('statutFilter').value = 'tous';
    document.getElementById('divisionFilter').value = 'tous';
    document.getElementById('searchInput').value = '';
    currentStatut = 'tous';
    currentDivision = 'tous';
    currentSearch = '';
    currentPage = 1;
    loadRequetes();
}

function applyFilters() {
    currentStatut = document.getElementById('statutFilter').value;
    currentDivision = document.getElementById('divisionFilter').value;
    currentSearch = document.getElementById('searchInput').value;
    currentPage = 1;
    loadRequetes();
}

// Événements
document.getElementById('filterBtn').onclick = applyFilters;
document.getElementById('resetBtn').onclick = resetFilters;

let searchTimeout;
document.getElementById('searchInput').onkeyup = function() {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(applyFilters, 500);
};

// Chargement initial
loadRequetes();
</script>
{% endblock %}
